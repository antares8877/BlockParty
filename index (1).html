<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Pattern Music Visualizer</title>
<style>
  @font-face{
    font-family:'MuseoModerno Black';
    src:url('MuseoModerno-Black.ttf') format('truetype');
    font-weight:900; font-display:swap;
  }
  :root{ --paper:#e8d6bd; --paper-shade:#dcc9a8; --ink:#281847; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper-shade);}
  body{
    font-family:-apple-system,'Segoe UI',sans-serif; color:var(--ink);
    -webkit-font-smoothing:antialiased; touch-action:none; cursor:default;
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh;
  }
  #stage{display:block;}
  #wake{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--paper-shade); z-index:10; transition:opacity .4s ease;
  }
  #wake.gone{opacity:0; pointer-events:none;}
  #wake p{
    font-family:ui-monospace,monospace; font-size:clamp(12px,2vw,15px);
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink); opacity:.6; text-align:center;
  }
  @media (prefers-reduced-motion: reduce){ #wake{transition:none;} }
</style>

<div id="wake"><p id="wakeMsg">cargando instrumentos…</p></div>
<canvas id="stage"></canvas>

<script>
(function(){
  "use strict";

  /* -----------------------------------------------------------------
     Puerto fiel de PadPod (https://catistica.github.io/PadPod/), ahora
     con los assets reales subidos por el usuario: los 8 .wav, las
     imágenes (flor/gradient/titulo/cruz/info/flechas/spacebar) y la
     tipografía MuseoModerno-Black. El p5.js original se reescribe acá
     en Canvas2D + Web Audio, pero cada constante, color, fórmula y
     posición de este archivo viene del index.js real (775 líneas),
     leído completo — no por aproximación.

     Loop real: 8.727279s por vuelta, 110 BPM, 4 compases de 4/4 — los
     8 archivos están pre-renderizados para encajar entre sí sin
     cuantizar; por eso togglear una capa la hace sonar YA, como en el
     original (keyPressed -> isPlaying() ? stop() : loop(), sin
     scheduler ni quantize).
  -------------------------------------------------------------------*/

  var TAU = Math.PI * 2;

  // zonas de grilla (sin cambios, ya confirmadas contra la fuente) +
  // volumen base real de cada capa (suboybajovol, keyPressed real)
  var LAYERS = [
    { key:'q', name:'Cuerdas', asset:'cuerdas', baseVol:1   },
    { key:'s', name:'Shakers', asset:'shakers', baseVol:0.5 },
    { key:'x', name:'Bajo',    asset:'bajo',    baseVol:1   },
    { key:'f', name:'Bateria', asset:'bateria', baseVol:0.7 },
    { key:'w', name:'Chords',  asset:'chords',  baseVol:0.7 },
    { key:'d', name:'Bamboos', asset:'bamboos', baseVol:0.5 },
    { key:'c', name:'Trumpet', asset:'trumpet', baseVol:1   },
    { key:'a', name:'Clap',    asset:'clap',    baseVol:0.5 }
  ];
  var byKey = {}, byName = {};
  LAYERS.forEach(function(L){
    L.playing=false; L.level=0; L.buffer=null; L.source=null;
    L.gainNode=null; L.analyser=null; L.rmsBuf=null;
    byKey[L.key]=L; byName[L.name]=L;
  });

  /* ---------------- canvas / grid ---------------- */
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var m, miti, DPR, stageW, stageH;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    m = Math.min(window.innerWidth/24, window.innerHeight/13);
    miti = m/2;
    stageW = m*24; stageH = m*13;
    canvas.width = stageW*DPR; canvas.height = stageH*DPR;
    canvas.style.width = stageW+'px'; canvas.style.height = stageH+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();
  function px(u){ return u*m; }

  // paleta "Block Party" — crema sin cambios, acentos nuevos tomados
  // (solo los tonos planos, sin gradient) de la referencia subida,
  // menos el bordo. SAGE es tono nuevo, sin rol en el original: lo
  // usamos en el fondo de shakers, que antes quedaba invisible por
  // ser del mismo crema que el fondo general.
  var PAPER='#e8d6bd', INK='#281847', BLUE='#3337f6', LAVENDER='#fb89ce', ORANGE='#fd5a0f', SAGE='#adc2c7';

  /* ---------------- real assets ---------------- */
  var IMG = {};
  var IMG_NAMES = ['flor','gradient','titulo','cruz','info',
    'arrowUpWhite','arrowDownWhite','arrowUpBlack','arrowDownBlack',
    'spacebarWhite','spacebarBlack'];
  var imagesLoaded = 0;
  IMG_NAMES.forEach(function(n){
    var im = new Image();
    im.onload = function(){ imagesLoaded++; };
    im.src = n + (n==='titulo' ? '.jpg' : '.png');
    IMG[n] = im;
  });

  function drawImgCenter(img, cx, cy, w, h){
    if (img && img.complete) ctx.drawImage(img, cx-w/2, cy-h/2, w, h);
  }
  function drawImgCorner(img, x, y, w, h){
    if (img && img.complete) ctx.drawImage(img, x, y, w, h);
  }

  /* ---------------- audio engine (real samples) ----------------
     Cada capa reproduce su .wav/.mp3 real en loop desde el instante
     del toggle (como p5.SoundFile.loop()/.stop() — sin cuantizar).
     volgeneral arranca en 1, paso 0.1 con las flechas, igual que el
     keyPressed() real; cada capa tiene su propio volumen base
     (suboybajovol) multiplicado por volgeneral. El nivel que mueve
     las animaciones es RMS real de cada señal (como p5.Amplitude). */
  var actx = new (window.AudioContext||window.webkitAudioContext)();
  var volgeneral = 1;
  var audioReadyCount = 0;

  LAYERS.forEach(function(L){
    L.gainNode = actx.createGain();
    L.gainNode.gain.value = L.baseVol * volgeneral;
    L.analyser = actx.createAnalyser();
    L.analyser.fftSize = 1024;
    L.rmsBuf = new Float32Array(L.analyser.fftSize);
    L.gainNode.connect(L.analyser);
    L.analyser.connect(actx.destination);

    fetch(L.asset + '.mp3')
      .then(function(r){ return r.arrayBuffer(); })
      .then(function(ab){ return actx.decodeAudioData(ab); })
      .then(function(buf){ L.buffer = buf; audioReadyCount++; checkReady(); })
      .catch(function(e){ audioReadyCount++; checkReady(); console.warn('audio load failed', L.asset, e); });
  });

  function updateVolumes(){
    LAYERS.forEach(function(L){ L.gainNode.gain.value = L.baseVol * volgeneral; });
  }

  function resumeAudio(){ if (actx.state === 'suspended') actx.resume(); }

  function toggleLayer(L){
    if (L.playing){
      if (L.source){ try{ L.source.stop(); }catch(e){} L.source=null; }
      L.playing = false;
    } else if (L.buffer){
      var src = actx.createBufferSource();
      src.buffer = L.buffer; src.loop = true;
      src.connect(L.gainNode);
      src.start(0);
      L.source = src;
      L.playing = true;
    }
  }
  function stopAll(){ LAYERS.forEach(function(L){ if (L.playing) toggleLayer(L); }); }

  function rms(L){
    if (!L.playing) return 0;
    L.analyser.getFloatTimeDomainData(L.rmsBuf);
    var sum=0;
    for (var i=0;i<L.rmsBuf.length;i++){ var v=L.rmsBuf[i]; sum += v*v; }
    return Math.sqrt(sum/L.rmsBuf.length);
  }

  /* ---------------- ready / wake ---------------- */
  var wakeEl = document.getElementById('wake'), wakeMsg = document.getElementById('wakeMsg');
  var totalAssets = IMG_NAMES.length, started = false;
  function checkReady(){
    if (imagesLoaded >= totalAssets && audioReadyCount >= LAYERS.length){
      wakeMsg.textContent = 'tocá una tecla para empezar · click para cambiar de vista';
    }
  }
  var imgCheck = setInterval(function(){
    if (imagesLoaded >= totalAssets){ checkReady(); clearInterval(imgCheck); }
  }, 150);

  /* ---------------- input ---------------- */
  var pressed = {};
  var prendido = true;
  var heldUp=false, heldDown=false, heldSpace=false;
  function wake(){ if(!started){ started=true; wakeEl.classList.add('gone'); } }

  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (k===' '){ e.preventDefault(); heldSpace=true; wake(); resumeAudio(); stopAll(); return; }
    if (k==='arrowup'){ e.preventDefault(); heldUp=true; volgeneral=Math.min(1,volgeneral+0.1); updateVolumes(); return; }
    if (k==='arrowdown'){ e.preventDefault(); heldDown=true; volgeneral=Math.max(0,volgeneral-0.1); updateVolumes(); return; }
    var L = byKey[k];
    if (!L) return;
    e.preventDefault();
    if (pressed[k]) return;
    pressed[k]=true;
    wake(); resumeAudio();
    toggleLayer(L);
  });
  window.addEventListener('keyup', function(e){
    var k=e.key.toLowerCase();
    pressed[k]=false;
    if (k===' ') heldSpace=false;
    if (k==='arrowup') heldUp=false;
    if (k==='arrowdown') heldDown=false;
  });
  canvas.addEventListener('click', function(){ prendido = !prendido; });

  /* ---------------- botones (fieles a botonApagado/botonPrendido) ----------------
     real: apagado = fill ink + stroke paper(peso m/miti) + texto paper;
     prendido = fill paper + stroke paper + texto ink. Tipografía real
     MuseoModerno-Black, textSize m/1.7. */
  function roundRectPath(x,y,w,h,rad){
    ctx.beginPath();
    ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
    ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath();
  }
  function botonBase(gx, gy, fill){
    var x=px(gx), y=px(gy);
    ctx.fillStyle = fill;
    roundRectPath(x, y, m, m, m/3); ctx.fill();
    ctx.strokeStyle = PAPER; ctx.lineWidth = 2;
    roundRectPath(x, y, m, m, m/3); ctx.stroke();
  }
  function botonApagado(gx, gy, letra){
    botonBase(gx, gy, INK);
    if (letra){
      ctx.fillStyle = PAPER;
      ctx.font = '900 ' + (m/1.7) + 'px "MuseoModerno Black",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(letra, px(gx)+m/2, px(gy)+m/2+1);
      ctx.textAlign='left';
    }
  }
  function botonPrendido(gx, gy, letra){
    botonBase(gx, gy, PAPER);
    if (letra){
      ctx.fillStyle = INK;
      ctx.font = '900 ' + (m/1.7) + 'px "MuseoModerno Black",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(letra, px(gx)+m/2, px(gy)+m/2+1);
      ctx.textAlign='left';
    }
  }
  function boton(gx, gy, L){ (L.playing?botonPrendido:botonApagado)(gx, gy, L.key); }

  /* ---------------- bajo (incondicional, primero) ----------------
     real: rect(7,1,11,3) azul; xbajo=map(level,0,1,7m,18m); 10 líneas
     desde el punto fijo (7,4) a (xbajo+i, 1) — el abanico se desliza. */
  function drawBajoBase(){
    var L = byName.Bajo;
    ctx.fillStyle = BLUE; ctx.fillRect(px(7), px(1), px(11), px(3));
    var level = rms(L);
    var xbajo = px(7) + level*px(11);
    ctx.strokeStyle = PAPER; ctx.lineWidth = 2;
    for (var i=0;i<10;i++){
      ctx.beginPath();
      ctx.moveTo(px(7), px(4));
      ctx.lineTo(xbajo + i*m, px(1));
      ctx.stroke();
    }
  }

  /* ---------------- botonera / vista pasiva ---------------- */
  function botonera(){
    ctx.fillStyle = INK; roundRectPath(px(5),px(4),px(7),px(7),0); ctx.fill();

    // flechitas de volumen — botón base + ícono blanco, y si está
    // apretada: botón prendido + ícono negro encima (igual al real).
    botonApagado(6,9,''); drawImgCenter(IMG.arrowUpWhite, px(6)+m*0.48, px(9)+m*0.7, m*0.4, m*0.9);
    botonApagado(7,9,''); drawImgCenter(IMG.arrowDownWhite, px(7)+m*0.5, px(9)+m*0.28, m*0.4, m*0.9);
    if (heldUp){ botonPrendido(6,9,''); drawImgCenter(IMG.arrowUpBlack, px(6)+m*0.5, px(9)+m*0.75, m*0.5, m); }
    if (heldDown){ botonPrendido(7,9,''); drawImgCenter(IMG.arrowDownBlack, px(7)+m*0.5, px(9)+m*0.3, m*0.5, m); }

    // spacebar — fondo ink + borde paper + ícono; si está apretada,
    // fondo paper + ícono negro.
    ctx.fillStyle = INK; ctx.strokeStyle = PAPER; ctx.lineWidth = 2;
    roundRectPath(px(8), px(8), m*3, m, m/3); ctx.fill(); ctx.stroke();
    drawImgCenter(IMG.spacebarWhite, px(9.5), px(8.5), m*2.5, m*0.625);
    if (heldSpace){
      ctx.fillStyle = PAPER;
      roundRectPath(px(8), px(8), m*3, m, m/3); ctx.fill(); ctx.stroke();
      drawImgCenter(IMG.spacebarBlack, px(9.5), px(8.5), m*2.5, m*0.625);
    }

    boton(7,7, byName.Bajo);
    boton(8,6, byName.Bamboos);
    boton(9,6, byName.Bateria);
    boton(7,5, byName.Chords);
    boton(6,6, byName.Clap);
    boton(6,5, byName.Cuerdas);
    boton(7,6, byName.Shakers);
    boton(8,7, byName.Trumpet);

    drawImgCenter(IMG.cruz, px(11.5), px(4.5), m/3, m/3);
  }

  // vista pasiva — orden real exacto: clap, chords, bateria, trumpet,
  // shakers, bamboos, bajo, cuerdas, luego el ícono info.
  function vistaPasiva(){
    ctx.fillStyle = INK; ctx.fillRect(px(5), px(4), px(7), px(7));

    if (byName.Clap.playing){
      ctx.fillStyle = LAVENDER; ctx.fillRect(px(8), px(8), px(4), px(3));
      ctx.fillStyle = BLUE;
      ctx.fillRect(px(5), px(8), px(3), px(3));
      ctx.fillRect(px(10), px(8), px(1), px(3));
    }
    if (byName.Chords.playing){
      ctx.save();
      ctx.translate(px(10), px(6)); ctx.rotate(Math.PI);
      drawImgCenter(IMG.gradient, 0, 0, px(4), px(4));
      ctx.restore();
    }
    if (byName.Bateria.playing){
      ctx.fillStyle = BLUE; ctx.fillRect(px(5), px(4), px(3), px(7));
      [11,9.5,8,6.5,5].forEach(function(y){
        ctx.save(); ctx.translate(px(6.5), px(y)); ctx.rotate(Math.PI/4);
        ctx.fillStyle = INK; var s=m*2.12; ctx.fillRect(-s/2,-s/2,s,s);
        ctx.restore();
      });
    }
    if (byName.Trumpet.playing){
      ctx.fillStyle = ORANGE; ctx.fillRect(px(5), px(4), px(3), px(4));
      ctx.fillStyle = LAVENDER;
      roundRectPath(px(0), px(4), px(8), px(4), m*2); ctx.fill();
    }
    if (byName.Shakers.playing){
      ctx.fillStyle = BLUE;
      for (var gx=8; gx<12; gx+=0.5){
        for (var gy=4; gy<8; gy+=0.5){
          ctx.beginPath(); ctx.arc(px(gx), px(gy), m/4, 0, TAU); ctx.fill();
        }
      }
    }
    if (byName.Bamboos.playing){
      ctx.fillStyle = ORANGE;
      [[10,7,1,0.5],[11,8,1,0.5],[8,8,1,0.5],[10,8,2,0.5],
       [9,8.5,2,0.5],[6,9.5,3,0.5],[7,10,3,0.5],[9,10.5,3,0.5]
      ].forEach(function(r){ ctx.fillRect(px(r[0]),px(r[1]),px(r[2]),px(r[3])); });
    }
    if (byName.Bajo.playing){
      ctx.strokeStyle = PAPER; ctx.lineWidth = 2;
      [5,5.5,6,6.5,7].forEach(function(y){
        ctx.beginPath(); ctx.moveTo(px(5), px(y)); ctx.lineTo(px(12), px(y)); ctx.stroke();
      });
    }
    if (byName.Cuerdas.playing){
      drawImgCenter(IMG.flor, px(5), px(6), px(2), px(2));
    }
    drawImgCenter(IMG.info, px(11.5), px(4.5), m/3, m/3);
  }

  /* ---------------- DISEÑO ESTÁTICO (incondicional) ---------------- */
  function disenoEstatico(){
    ctx.fillStyle = BLUE; ctx.fillRect(px(18), px(4), px(6), px(9));
    ctx.fillStyle = INK;
    var x, y;
    for (x=18; x<22.5; x+=2){ for (y=4.5; y<23; y+=1){ if (y<13) ctx.fillRect(px(x),px(y),m,miti); } }
    for (x=19; x<24; x+=2){ for (y=4; y<22.5; y+=1){ if (y<13) ctx.fillRect(px(x),px(y),m,miti); } }

    ctx.fillStyle = INK; ctx.fillRect(px(18), px(1), px(3), px(3));
    ctx.fillStyle = LAVENDER; ctx.fillRect(px(21), px(1), px(3), px(3));
    ctx.fillStyle = BLUE; ctx.fillRect(px(5), px(11), px(7), px(2));

    ctx.fillStyle = LAVENDER; ctx.fillRect(px(0), px(1), px(5), stageH);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px(2.5), px(1)); ctx.lineTo(px(2.5), px(13)); ctx.stroke();

    ctx.fillStyle = SAGE; ctx.fillRect(px(5), px(1), px(2), px(3));
  }

  /* ---------------- ANIMACIÓN (incondicional) ---------------- */
  var BAMBOO_BARS = [
    {x:18, cant:200, color:ORANGE}, {x:19, cant:270, color:LAVENDER},
    {x:20, cant:180, color:ORANGE}, {x:21, cant:240, color:LAVENDER},
    {x:22, cant:310, color:ORANGE}, {x:23, cant:150, color:LAVENDER}
  ];

  function animacion(){
    // bamboos — bamboosrebotan(x,cant): h=map(level,0,1,0,cant*m)
    var lvlBam = rms(byName.Bamboos);
    BAMBOO_BARS.forEach(function(b){
      var h = lvlBam * b.cant * m;
      ctx.fillStyle = b.color;
      ctx.fillRect(px(b.x), px(13)-h, m, h);
    });

    // bateria — wbat=map(level,0,1,0,16.5m); idle=2.12m fijo
    (function(){
      var L = byName.Bateria;
      var side = L.playing ? rms(L)*16.5*m : 2.12*m;
      ctx.save(); ctx.translate(px(19.5), px(2.5)); ctx.rotate(Math.PI/4);
      ctx.fillStyle = LAVENDER;
      ctx.fillRect(-side/2,-side/2,side,side);
      ctx.restore();
    })();

    // chords — gradient (sin rotar) solo mientras suena, sobre su
    // cuadrado; flor central, gira solo mientras suena.
    (function(){
      var L = byName.Chords;
      if (L.playing){
        drawImgCorner(IMG.gradient, px(21), px(1), px(3), px(3));
        if (!reduceMotion) L.angle = (L.angle||0) + 0.03;
      } else {
        L.angle = 0;
      }
      ctx.save();
      ctx.translate(px(22.5), px(2.5)); ctx.rotate(L.angle||0);
      drawImgCenter(IMG.flor, 0, 0, px(3), px(3));
      ctx.restore();
    })();

    // clap — wclap=map(level,0,1,0,500m), SIEMPRE (no gateado)
    (function(){
      var w = rms(byName.Clap) * 500 * m;
      ctx.fillStyle = ORANGE;
      ctx.fillRect(px(5), px(11), w, px(3));
      ctx.fillRect(px(12)-w, px(11), w, px(3));
    })();

    // cuerdas — ycuerdas=map(level,0,1,2.5m,200m), SIEMPRE
    (function(){
      var y = px(2.5) + rms(byName.Cuerdas)*200*m;
      drawImgCenter(IMG.flor, px(2.5), y, px(3), px(3));
    })();

    // shakers — circulosRandom(4*m, m/40) sonando; grilla fija en reposo
    (function(){
      var L = byName.Shakers;
      ctx.fillStyle = '#000';
      if (L.playing){
        var n = Math.min(500, Math.round(4*m));
        for (var i=0;i<n;i++){
          var rx = px(5) + Math.random()*px(2);
          var ry = px(1) + Math.random()*px(3);
          ctx.beginPath(); ctx.arc(rx, ry, m/80, 0, TAU); ctx.fill();
        }
      } else {
        for (var gx=5.07; gx<6.95; gx+=0.35){
          for (var gy=1.07; gy<3.95; gy+=0.35){
            ctx.beginPath(); ctx.arc(px(gx), px(gy), m/80, 0, TAU); ctx.fill();
          }
        }
      }
    })();

    // trumpet — ellipseMode(CORNER): caja x=12, centro real x=15;
    // hcaja=9m fijo, htrumpet=4m+map(level,0,1,0,100m), resto 2:1.
    (function(){
      var L = byName.Trumpet;
      var hcaja = 9*m;
      var htrumpet = 4*m + rms(L)*100*m;
      if (htrumpet > hcaja) htrumpet = hcaja;
      var hresto = hcaja - htrumpet;
      var h2 = hresto*2/3, h3 = hresto - h2;
      var cx = px(15), top = px(4);
      ctx.fillStyle = LAVENDER;
      ctx.beginPath(); ctx.ellipse(cx, top+htrumpet/2, px(3), htrumpet/2, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx, top+htrumpet+h2/2, px(3), h2/2, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx, top+htrumpet+h2+h3/2, px(3), h3/2, 0, 0, TAU); ctx.fill();
    })();
  }

  /* ---------------- barra de volumen ----------------
     real: rect(4.9m,0,wvolg,m), wvolg=map(volgeneral,0,1,0,24m).
     (título y créditos sacados por pedido del usuario — vuelven con
     el nombre/branding nuevo cuando lo defina). */
  function drawVolumeBar(){
    var wvolg = volgeneral * px(24);
    ctx.fillStyle = ORANGE;
    ctx.fillRect(px(4.9), 0, Math.min(wvolg, stageW-px(4.9)), m);
  }

  /* ---------------- render loop ----------------
     el original tiene un frameRate(10) que se activa (y queda pegado
     para siempre) apenas suena shakers — a pedido del usuario, no lo
     replicamos: el sketch se mantiene fluido siempre. */
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(){
    draw();
    requestAnimationFrame(frame);
  }
  function draw(){
    ctx.clearRect(0,0,stageW,stageH);
    ctx.fillStyle = PAPER; ctx.fillRect(0,0,stageW,stageH);

    drawBajoBase();
    if (prendido) botonera(); else vistaPasiva();
    disenoEstatico();
    animacion();
    drawVolumeBar();
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
